# Tooling configuration only. This project is not packaged or installed;
# runtime deps are in requirements.txt, dev deps in requirements-dev.txt.

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Rules stated explicitly, since ruff's default set changes between releases.
select = ["E4", "E7", "E9", "F", "B023", "B904", "I", "PTH118", "PTH123", "RUF022", "RUF100", "TRY400", "UP"]

[tool.ruff.lint.isort]
# Keep aliased imports in their block, rather than one statement per `X as Y`.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Ignoring by file keeps each rule live everywhere else.
# E712 is not a safe fix here: `None == False` differs from `not None`.
"app/features/matches/service.py" = ["E711", "E712"]
"app/features/matches/editing.py" = ["E712"]
# B023 misfires (the closure runs inside its own loop); PTH123 is the CLI block.
"app/features/matches/parsers/civ6.py" = ["B023", "PTH123"]
"app/features/matches/parsers/civ7.py" = ["PTH123"]
# The save-file harness, run by hand: a path rewritten for lint finds no saves
# and passes with zero assertions.
"test/parsing/*" = ["PTH118", "PTH123"]

[tool.mypy]
python_version = "3.14"
files = ["app"]
# A missing first-party module must fail the check; only trueskill ships
# without types, and it is named below.
ignore_missing_imports = false
# A permissive baseline; strictness rises per module as each is rewritten.

[[tool.mypy.overrides]]
module = ["trueskill", "trueskill.*"]
ignore_missing_imports = true

# Quarantine: each entry goes when its file is rewritten.
[[tool.mypy.overrides]]
module = [
  "app.features.matches.approval",
  "app.features.matches.service",
  "app.features.matches.editing",
]
ignore_errors = true

[tool.pytest.ini_options]
# The repo is not installed, so `app` imports only with the root on sys.path,
# which bare `pytest` does not add.
pythonpath = ["."]
testpaths = ["test"]
markers = [
  "unit: unit tests",
  "parsing: save-file parser tests",
  "civ6: Civ6 fixtures",
  "civ7: Civ7 fixtures",
]
