name: CI

on:
  push:
    branches: [master, v2]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # config.py needs this one field at import. MITO_ and AUTH_ tokens stay
      # unset, so the tests still cover their 503 path.
      LJ_SERVICE_TOKEN: ci-dummy-not-a-secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Typecheck
        run: mypy

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      # A route changed without regenerating the spec is a red build. The app
      # is imported, not run; sort_keys must match scripts/spec.py.
      - name: Contracts — app matches committed spec
        run: |
          python - <<'PY'
          import json, sys
          from app.main import app
          live = json.dumps(app.openapi(), indent=2, sort_keys=True) + "\n"
          committed = open("openapi.json").read()
          if live != committed:
              sys.exit("openapi.json is stale. Regenerate and commit it.")
          print("spec matches")
          PY
